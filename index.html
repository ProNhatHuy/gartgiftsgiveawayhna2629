<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GART 10th Year Anniversary Project 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        h3 {
            font-size: 1.2rem;
            color: #ff5500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #ff5500;
            line-height: 1.2;
        }

        h2 {
            font-size: 1.4rem;
            color: #aaaaaa;
            font-weight: normal;
            margin-bottom: 2.5rem;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            border: 2px solid #ff5500;
            background-color: #1a1a1a;
            color: white;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #ff5500;
            box-shadow: 0 0 15px #ff5500;
        }

        /* Jumpscare overlay hidden by default */
        #jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Rapid blinking animation */
        @keyframes strobe {
            0% { background-color: #ffffff; color: #000000; }
            50% { background-color: #000000; color: #ffffff; }
            100% { background-color: #ffffff; color: #000000; }
        }

        /* Class applied to activate blinking */
        .blinking-active {
            animation: strobe 0.15s infinite;
        }

        .meme-text {
            font-size: 4.5rem;
            font-weight: bold;
            font-family: "Times New Roman", Times, serif;
            margin-bottom: 2rem;
            text-align: center;
        }

        .smiley-container {
            display: flex;
            gap: 40px;
        }

        .smiley {
            font-size: 5rem;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>VEX Robotics Contest – Exclusive Giveaway</h3>
        <h1>Do you want a free robot model Netherite Gift?</h1>
        <h2>It's free on the shelf right now for the GART 10th Anniversary Project!</h2>
        
        <div class="btn-container">
            <button onclick="triggerScare()">Yes, I want to</button>
            <button onclick="triggerScare()">Maybe you aren't a fan of technological stuffs</button>
        </div>
    </div>

    <!-- The Scare Overlay -->
    <div id="jumpscare">
        <div class="meme-text">you are an idiot</div>
        <div class="smiley-container">
            <div class="smiley">☺</div>
            <div class="smiley">☺</div>
            <div class="smiley">☺</div>
        </div>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="scare-audio" crossorigin="anonymous" loop>
        <source src="https://myinstants.com" type="audio/mp3">
    </audio>

    <script>
        // Track Escape key count and timing for the back-door exit
        let escCount = 0;
        let escTimeout;

        function triggerScare() {
            const jumpscareDiv = document.getElementById('jumpscare');
            const audio = document.getElementById('scare-audio');

            jumpscareDiv.style.display = 'flex';
            jumpscareDiv.classList.add('blinking-active');

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen blocked or already active.");
                });
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }

            audio.volume = 1.0;
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Playback failed initially, retrying audio stream...", error);
                    document.body.addEventListener('click', () => { audio.play(); }, { once: true });
                });
            }

            // Start listening for the secret developer bypass sequence
            window.addEventListener('keydown', handleGlobalKeydown);
        }

        function handleGlobalKeydown(event) {
            // Listen explicitly for the 'Escape' key
            if (event.key === 'Escape' || event.keyCode === 27) {
                escCount++;

                // Clear previous timeout tracker window
                clearTimeout(escTimeout);

                // If user hits the sequence 3 times rapidly, terminate the prank
                if (escCount >= 3) {
                    stopScare();
                } else {
                    // Reset count sequence if they don't press it again within 1.5 seconds
                    escTimeout = setTimeout(() => {
                        escCount = 0;
                    }, 1500);
                }
            }
        }

        function stopScare() {
            const jumpscareDiv = document.getElementById('jumpscare');
            const audio = document.getElementById('scare-audio');

            // 1. Hide the overlay container and stop flash
            jumpscareDiv.style.display = 'none';
            jumpscareDiv.classList.remove('blinking-active');

            // 2. Safely pause the looping prank track
            audio.pause();
            audio.currentTime = 0;

            // 3. Drop browser out of full screen mode cleanly
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }

            // Reset trackers and remove event listener cleanly
            escCount = 0;
            window.removeEventListener('keydown', handleGlobalKeydown);
        }
    </script>
</body>
</html>
