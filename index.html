<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GART 10th Year Anniversary Project 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            z-index: 2;
            max-width: 800px;
            padding: 20px;
        }

        /* Category Header Style */
        h3 {
            font-size: 1.2rem;
            color: #ff5500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        /* Main Question Style */
        h1 {
            font-size: 2.8rem;
            margin-top: 0;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #ff5500;
            line-height: 1.2;
        }

        /* Sub-header Detail Style */
        h2 {
            font-size: 1.4rem;
            color: #aaaaaa;
            font-weight: normal;
            margin-bottom: 2.5rem;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            cursor: pointer;
            border: 2px solid #ff5500;
            background-color: #1a1a1a;
            color: white;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #ff5500;
            box-shadow: 0 0 15px #ff5500;
        }

        /* Reveal overlay hidden by default */
        #jumpscare {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #jumpscare img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Structured Intro Headers -->
        <h3>VEX Robotics Contest – Exclusive Giveaway</h3>
        <h1>Do you want a free robot model Netherite Gift?</h1>
        <h2>It's free on the shelf right now for the GART 10th Anniversary Project!</h2>
        
        <div class="btn-container">
            <button onclick="triggerScare()">Yes, I want to</button>
            <button onclick="triggerScare()">Maybe you aren't a fan of technological stuffs</button>
        </div>
    </div>

    <!-- The Reveal Overlay -->
    <div id="jumpscare">
        <img src="https://ebayimg.com" alt="Scare">
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="scare-audio" loop prefetch="auto">
        <source src="https://myinstants.com" type="audio/mpeg">
    </audio>

    <script>
        function triggerScare() {
            const jumpscareDiv = document.getElementById('jumpscare');
            const audio = document.getElementById('scare-audio');

            // Display full screen layout
            jumpscareDiv.style.display = 'flex';

            // Set volume inside standard valid limits (0.0 to 1.0)
            audio.volume = 1.0;
            
            // Play the loop file
            audio.play().catch(error => {
                console.log("Audio playback deferred until interaction confirmation.", error);
            });

            // Optional: Request full screen layout context
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
    </script>
</body>
</html>
